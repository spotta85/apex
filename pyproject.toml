[project]
name = "apex"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "gguf>=0.18.0",
    "jinja2>=3.1",
    "mlx>=0.32.3",
    "numpy>=2.2.6",
    "safetensors>=0.7.0",
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "mlx-lm>=0.32.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "real_checkpoint: needs the real Gemma 4 checkpoint on disk (auto-skipped when absent)",
]
